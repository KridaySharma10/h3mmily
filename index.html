<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>maanya.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8cfe4;--surface:#ece6f3;--ink:#0d0b10;--rose:#e610a8;--blush:#e6def0;--grey:#5f5873;--line:rgba(13,11,16,.14);
--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0b090e;--surface:#17121e;--ink:#d8cfe4;--rose:#ff3df0;--blush:#221a2c;--grey:#9b92ad;--line:rgba(216,207,228,.14)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--grey)}
.serif{font-family:var(--serif);font-weight:300}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
#home{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px;text-align:center}
.logo{font:300 clamp(64px,14vw,120px)/1 var(--serif);letter-spacing:-.04em}
.logo i{color:var(--rose);font-style:normal;text-shadow:0 0 10px var(--rose),0 0 26px var(--rose)}
.tag{font:italic 300 clamp(16px,2.4vw,20px) var(--serif);color:var(--grey);margin-bottom:22px}
.sw{position:relative;width:min(620px,100%)}
.bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:0 14px;height:54px;transition:box-shadow .25s,border-color .25s}
.bar:focus-within{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose),0 0 26px rgba(255,43,214,.45)}
.bar input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--ink);caret-color:var(--rose);min-width:0}
.bar svg{width:18px;height:18px;stroke:var(--grey);fill:none;stroke-width:1.8;flex:none}
.clr{visibility:hidden;padding:4px}
.bar.has .clr{visibility:visible}
.sug{position:absolute;left:0;right:0;top:60px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;text-align:left;z-index:5;display:none;box-shadow:0 14px 40px rgba(0,0,0,.08)}
.sug.on{display:block;animation:in .15s ease}
.sug button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:12px}
.sug button.act,.sug button:hover{background:var(--blush)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;margin-top:18px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--grey);transition:.2s}
.chip:hover{color:var(--ink);border-color:var(--rose);background:var(--blush)}
.foot{margin-top:40px}
#res{display:none;min-height:100%}
.top{display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:4;flex-wrap:wrap}
.top .logo{font-size:28px;cursor:pointer}
.top .sw{flex:1;min-width:220px;max-width:600px}
.top .bar{height:44px}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:12px 14px;color:var(--grey);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--rose)}
main{max-width:1100px;margin:0 auto;padding:22px 20px 80px}
.load{height:2px;background:var(--rose);width:0;position:fixed;top:0;left:0;z-index:20}
.load.go{animation:ld .35s ease forwards}
@keyframes ld{to{width:100%;opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.r{display:flex;gap:16px;padding:16px 0;max-width:680px;animation:in .3s ease both}
.r .t{width:84px;height:84px;border-radius:10px;flex:none}
.src{font-size:12px;color:var(--grey)}
.r h3{font:400 19px/1.3 var(--serif);margin:2px 0 4px}
.r h3 button{text-align:left}
.r h3 button:hover{text-decoration:underline;text-decoration-color:var(--rose)}
.r p{color:var(--grey)}
.grid{columns:3 220px;column-gap:14px}
.tile{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:10px;overflow:hidden;display:block;width:100%;transition:transform .3s}
.tile:hover{transform:translateY(-3px)}
.tile img,.t img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;inset:auto 0 0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:13px;opacity:0;transition:.25s;text-align:left}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.empty{text-align:center;padding:70px 0}
.empty h2{font:300 28px var(--serif);margin-bottom:8px}
.egg{background:var(--blush);border-radius:16px;padding:34px 26px;margin-bottom:26px;text-align:center}
.egg h2{font:300 clamp(28px,5vw,44px)/1.15 var(--serif)}
.egg p{max-width:520px;margin:12px auto 0}
.egg .l{display:block;opacity:0;animation:in .7s ease forwards}
.tools{display:flex;gap:10px;margin-bottom:18px;align-items:center}
.btn{border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:13px}
.btn:hover{border-color:var(--rose);background:var(--blush)}
#lb{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;grid-template-columns:1fr 360px;touch-action:pan-y}
#lb.on{display:grid;animation:in .25s ease}
.lbi{display:flex;align-items:center;justify-content:center;padding:56px 24px 24px;min-height:0}
.lbi>*{max-width:100%;max-height:100%;border-radius:8px}
.lbi img{object-fit:contain}
.lbt{padding:64px 28px 28px;overflow:auto;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.lbt h2{font:300 28px/1.15 var(--serif)}
.lbt .m{font:300 18px/1.6 var(--serif)}
.nav{position:absolute;top:12px;display:flex;gap:6px;align-items:center}
.nav button,.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ib:hover{border-color:var(--rose)}
.fav.on{background:var(--rose);color:#fff;border-color:var(--rose)}
#lb.note{grid-template-columns:1fr}#lb.note .lbt,#lb.note .lnav,#lb.note #fav,#lb.note #rnd{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
#kisses{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.kiss{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;animation:kiss 1.8s cubic-bezier(.2,.7,.3,1) forwards}
.kiss svg{width:100%;height:100%;fill:#ff2bd6;filter:drop-shadow(0 0 3px #ff2bd6) drop-shadow(0 0 9px #ff2bd6)}
@keyframes kiss{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(var(--r))}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-220px) scale(1.25) rotate(var(--r))}}
@media(max-width:760px){#lb.on{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.lbt{border:0;border-top:1px solid var(--line);padding:18px 20px 24px;max-height:46vh}.lbi{padding:56px 16px 8px}.grid{columns:2 140px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.egg .l{opacity:1}}
</style>
</head>
<body>
<div class="load" id="load"></div>

<canvas id="bg" aria-hidden="true"></canvas>
<section id="home">
  <h1 class="logo">maanya<i>.</i></h1>
  <p class="tag">every search i make ends at you, maanya. i wouldn't have it otherwise.</p>
  <div class="sw" data-sw></div>
  <div class="chips" id="chips"></div>
  <p class="mono foot" style="opacity:.7">tap anywhere. you're mine, and i adore you.</p>
  <p class="mono">made for maanya, by the man who can't stop thinking about her.</p>
</section>

<section id="res">
  <div class="top"><div class="logo" id="logo2" tabindex="0" role="link" aria-label="home">maanya<i>.</i></div><div class="sw" data-sw></div></div>
  <nav class="tabs" id="tabs" aria-label="categories"></nav>
  <main id="main"></main>
</section>

<div id="lb" role="dialog" aria-modal="true" aria-label="photo viewer">
  <div class="nav lnav" style="left:16px"><button id="prev" aria-label="previous">‹</button><button id="next" aria-label="next">›</button><span class="mono" id="pos"></span></div>
  <div class="nav" style="right:16px"><button class="ib" id="fav" aria-label="favourite">♡</button><button class="ib" id="rnd" aria-label="another photo">↻</button><button class="ib" id="close" aria-label="close">✕</button></div>
  <div class="lbi" id="lbi"></div>
  <div class="lbt"><span class="mono" id="lbm"></span><h2 id="lbtitle"></h2><p class="m" id="lbmsg"></p></div>
</div>
<div class="toast" id="toast"></div>
<div id="kisses" aria-hidden="true"></div>

<script>
const ANNIVERSARY = "2nd november";
const PHOTOS=[
 {id:"photo-01",src:IMG.snap,ratio:672/599,alt:"a photo of maanya",title:"mine, and i'm not sorry",caption:"say it back",keywords:["maanya","mine","best","funny","cute","playful","smile","number one","amazing"],message:"i don't share well, and i've stopped pretending otherwise. you're mine, maanya. look at that smile. i'd take on anything that tried to dim it, and i'd enjoy it."},
 {id:"photo-02",src:IMG.dress,ratio:441/1000,alt:"a photo of maanya in a yellow dress",title:"look at you",caption:"i'm not glancing away",keywords:["maanya","pretty","beautiful","dress","yellow","birthday","gorgeous","flawless","look","perfect"],message:"stand there a moment. let me stare. i've wanted this view since the second i met you, and i'd happily surrender whole evenings to it. the dress is lovely, but it's only fabric. you're the reason my words went missing."},
 {id:"photo-03",src:IMG.night,ratio:963/913,alt:"a close portrait of maanya at night",title:"you ruin me for everyone else",caption:"no contest, no appeal",keywords:["maanya","prettiest","prettiest girl","girl","ever seen","pretty","beautiful","smile","face","portrait","gorgeous"],message:"i've met striking people, ambitious people, people who beg for attention. you never ask, and i hand you all of it anyway. it's frankly unfair how thoroughly you've dismantled my self-control."},
 {id:"photo-04",src:IMG.red,ratio:739/1000,alt:"a photo of maanya in red",title:"under my protection",caption:"always within reach",keywords:["maanya","favourite person","favourite","love","cute","queen","red","protect","mine"],message:"wear red and the entire street turns. let them look. they'll see who takes you home. anyone who hurts you answers to me, and i keep my promises."},
 {id:"photo-05",src:IMG.together,ratio:685/771,alt:"a photo of maanya, together",title:"come here",caption:"closer",keywords:["maanya","why","why you","why it's always you","us","together","memories","love","comfort","only you","close"],message:"i like you tucked beside me, where my arm already knows the way. every road i travel bends toward you, and i quit resisting the curve long ago."},
 {id:"photo-06",src:IMG.nonch,ratio:0.969,alt:"a photo of maanya, unbothered",title:"you've no idea what you do to me",caption:"unbothered and devastating",keywords:["maanya","love of my life","soulmate","the one","unbothered","effortless","cool","love"],message:"you toss me that easy, careless glance and i forget my own name. nobody else has this effect on me, and nobody else gets the chance. you're the one i'd rearrange an entire life for."},
 {id:"photo-07",src:IMG.mirror,ratio:0.591,alt:"a photo of maanya in a mirror",title:"the reflection i'd frame",caption:"all of it, entirely yours",keywords:["maanya","perfect","flawless","amazing","best","mirror","pretty"],message:"i can't tell which of you the mirror prefers. a tie, except i only watch one. for the record, flawless isn't flattery. it's an observation, and i never get those wrong."},
 {id:"photo-08",src:IMG.meet,ratio:1.442,alt:"a photo of maanya",title:"where i go to breathe",caption:"home, in human form",keywords:["maanya","safe","safe place","comfort","home","calm","peace","quiet"],message:"my days are loud. then comes you, and everything hushes. i can be sharp with the world because i get to be gentle with you. you're the single place i never need to stand guard."},
 {id:"photo-09",src:IMG.step,ratio:0.566,alt:"a photo of maanya walking",title:"accomplice in everything",caption:"the one i'd trust with my life",keywords:["maanya","best friend","friend","girlfriend","talk","laugh","trouble","favourite person"],message:"you make me laugh when i least expect it, and nobody else gets away with that. girlfriend, confidante, favourite trouble. i'd follow you into chaos, then politely take over the driving."},
 {id:"photo-10",src:IMG.step2,ratio:0.590,alt:"a snap of maanya in racing-flag colours, sunglasses on, surrounded by news microphones",title:"the grand entrance",caption:"cameras ready, press restless",keywords:["maanya","funny","snap","famous","celebrity","entrance","sunglasses","press","microphones","step out","racing","flag"],message:"let the press scream all they like. you stride out like a headline, and i'm the one holding the exclusive."},
 {id:"photo-11",src:IMG.glasses,ratio:0.939,alt:"a photo of maanya in pink glasses with a small smile, on a video call",title:"the look that halts me mid-sentence",caption:"pink frames, quiet smirk",keywords:["maanya","glasses","pink","call","video call","facetime","smile","cute","calm","smirk","cozy"],message:"rose-coloured frames, a small half-smile, hair doing whatever it pleases. no grand evening could compete. ring me, and the rest of the world can wait."},
 {id:"photo-12",src:IMG.private,ratio:1.708,alt:"a private photo of maanya lying down with her phone",title:"just between us",caption:"locked away, strictly private",keywords:["maanya","private","secret","selfie","phone","cozy","lazy","between us","just us"],message:"a private frame, kept between you and me. the phone covers your face and still fails to hide you from me. consider this one under lock and key."}

const NOTES=[
 {id:"n6",title:"no second place",body:"i keep a very short list of things i'm sure about. you are every item on it. i've tested the claim under all conditions, and it holds.",keywords:["best","the best","the one","amazing","greatest","queen","number one","pretty","prettiest","no second place"]},
 {id:"n7",title:"official standings",body:"first place: maanya. second place: vacant. third place: vacant. the committee, which is me, has spoken.",keywords:["ranking","ranked","number one","top","who's the best","best","favourite","standings"]},
 {id:"n8",title:"for the record",body:"you're the woman i'd reorganise my whole existence around, and i've already begun. consider this a signed, permanent, non-refundable confession.",keywords:["love of my life","soulmate","forever","the one","i love you","love","confession"]},
 {id:"n9",title:"a standing order",body:"hear this daily: you're everything i'd have requested, plus several things i never knew to want. i'll keep announcing it until you quit arguing.",keywords:["perfect","you're perfect","flawless","amazing","best","order"]},
 {id:"n1",title:"exhibits a through z",body:"every photo here is evidence, and the verdict arrived long ago. i'm not seeking a fair trial. i'm seeking a life sentence, served beside you.",keywords:["evidence","biased","everything","verdict"]},
 {id:"n2",title:"what i notice in silence",body:"how hours speed up beside you. how a room rearranges itself when you enter. how calm i become the moment you appear. i pay close attention, and nothing escapes me.",keywords:["notice","details","things i love about you"]},
 {id:"n3",title:"the only answer",body:"whatever the question, the reply lands on you. i verified it twice, then once more out of sheer stubbornness.",keywords:["answer","why","why you","why it's always you","show me everything"]},
 {id:"n5",title:"about that story",body:"i know it stung, and i'd rather face it than let it fester between us. there's exactly one woman i answer to, and her name is maanya. you hold my attention, my loyalty and my word. i don't look elsewhere, and i don't intend to start.",keywords:["sorry","story","other girl","apology","maanya","only you","only maanya","jealous"]},
 {id:"n4",title:"i miss you",body:"if you're reading this, i'm somewhere that isn't beside you, and i resent it. shut your eyes for a moment. i'm thinking of you, and i'll be collecting you soon.",keywords:["i miss you","miss","missing"]}

function score(d,q){
  const t=q.toLowerCase().trim().split(/\s+/).filter(Boolean);let s=0;
  for(const w of t){
    for(const k of d.kw){const kl=k.toLowerCase();if(kl===q.toLowerCase())s+=10;else if(kl.includes(w)||w.includes(kl))s+=4}
    if(d.title.toLowerCase().includes(w))s+=3;
    if(d.text.toLowerCase().includes(w))s+=1;
  }
  return s?s+Math.random()*.9:0; // a little unpredictability
}

  const bar=$(".bar",sw),inp=$("input",sw),sug=$(".sug",sw);let idx=-1,items=[];
  const upd=()=>{bar.classList.toggle("has",!!inp.value);const v=inp.value.trim().toLowerCase();
    items=(v?SUGGESTIONS.filter(s=>s.includes(v)):hist.slice(-4).reverse().concat(SUGGESTIONS.slice(0,3))).filter((x,i,a)=>a.indexOf(x)===i).slice(0,6);
    idx=-1;sug.innerHTML=items.map((s,i)=>`<button role="option" data-i="${i}">${esc(s)}</button>`).join("");
    sug.classList.toggle("on",!!items.length&&document.activeElement===inp);inp.setAttribute("aria-expanded",sug.classList.contains("on"))};
  inp.addEventListener("input",upd);inp.addEventListener("focus",upd);
  inp.addEventListener("blur",()=>setTimeout(()=>sug.classList.remove("on"),120));
  inp.addEventListener("keydown",e=>{
    const b=$$("button",sug);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();idx=(idx+(e.key==="ArrowDown"?1:-1)+b.length)%b.length;b.forEach((x,i)=>x.classList.toggle("act",i===idx));inp.value=items[idx]}
    else if(e.key==="Enter"){e.preventDefault();go(inp.value)}
  });
  sug.addEventListener("mousedown",e=>{const b=e.target.closest("button");if(b){e.preventDefault();go(items[+b.dataset.i])}});
  $(".clr",sw).addEventListener("click",()=>{inp.value="";upd();inp.focus()});
  sw._set=v=>{inp.value=v;bar.classList.toggle("has",!!v)};
});
$("#chips").innerHTML=SUGGESTIONS.slice(0,6).map(s=>`<button class="chip">${esc(s)}</button>`).join("");
$("#chips").onclick=e=>{const c=e.target.closest(".chip");if(c)go(c.textContent)};
const goHome=()=>{history_push({});render()};
$("#logo2").onclick=goHome;$("#logo2").onkeydown=e=>{if(e.key==="Enter")goHome()};

/* routing: query lives in the URL so back/forward just work */
function history_push(st){
  try{window.history.pushState(st,"",st.q?"?"+new URLSearchParams(st):location.pathname)}
  catch(e){try{window.history.pushState(st,"")}catch(e2){}}}
function go(q,t){q=(q||"").trim();if(!q)return;if(!hist.includes(q.toLowerCase()))hist.push(q.toLowerCase());
  const ld=$("#load");ld.classList.remove("go");void ld.offsetWidth;if(!reduce)ld.classList.add("go");
  history_push({q,t:t||"everything"});setTimeout(render,reduce?0:200)}
addEventListener("popstate",render);

function render(){
  const st=window.history.state||{};query=st.q||"";tab=st.t||"everything";
  const home=!query;$("#home").style.display=home?"flex":"none";$("#res").style.display=home?"none":"block";
  $$("[data-sw]").forEach(s=>s._set(query));
  home?startBg():stopBg();
  if(home)return;
  window.scrollTo(0,0);
  $("#tabs").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("");
  const q=query.toLowerCase(),res=run(query,tab);let h="";
  if(/three months|3 months|anniversary/.test(q)){
    h+=`<div class="egg"><span class="mono l" style="animation-delay:.1s">${esc(ANNIVERSARY)}</span><h2 class="l" style="animation-delay:.5s">${esc(ANNIVERSARY_TEXT.title)}</h2>${ANNIVERSARY_TEXT.lines.map((l,i)=>`<p class="l serif" style="animation-delay:${1+i*.7}s">${esc(l)}</p>`).join("")}</div>`}
  if(!res.length&&!h){h=`<div class="empty"><h2>no results. unacceptable.</h2><p class="mono">nothing matched "${esc(query)}". try again, or just come find me.</p><p style="margin-top:18px"><button class="btn" id="rndq">surprise me</button></p></div>`}
  else if(tab==="images"){
    h+=`<div class="tools"><span class="mono">${res.length} images</span><button class="btn" id="rndq">discover</button></div><div class="grid">`;
    list=res.map(d=>PHOTOS[d.ref]);
    h+=list.map((p,i)=>tile(p,i)).join("")+"</div>";
  }else{
    h+=`<div class="tools"><span class="mono">about ${res.length} results (0.${Math.floor(Math.random()*40+10)} seconds, private index)</span><button class="btn" id="rndq">discover</button></div>`;
    h+=res.map((d,i)=>{
      const ph=d.type==="images"?PHOTOS[d.ref]:null;
      return `<div class="r" style="animation-delay:${Math.min(i,8)*40}ms">${ph?`<div class="t">${thumb(ph)}</div>`:""}<div><div class="src">maanya.archive › ${esc(d.type)}</div><h3><button data-open="${d.type}:${d.ref}">${esc(d.title)}</button></h3><p>${esc((d.text||"").slice(0,150))}${(d.text||"").length>150?"…":""}</p></div></div>`}).join("");
  }
  $("#main").innerHTML=h;
}
const thumb=p=>`<img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy">`;
const tile=(p,i)=>`<button class="tile" data-photo="${i}" style="aspect-ratio:${p.ratio}" aria-label="open ${esc(p.title)}"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy"><span class="cap">${esc(p.caption)}</span></button>`;

$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)go(query,b.dataset.t)};
$("#main").onclick=e=>{
  const t=e.target.closest("[data-photo]");if(t){openLb(+t.dataset.photo);return}
  const o=e.target.closest("[data-open]");if(o){const [ty,r]=o.dataset.open.split(":");
    if(ty==="images"){list=PHOTOS;openLb(+r)}else showNote(ty,r);return}
  if(e.target.id==="rndq")discover();
};
function showNote(ty,id){const n=DOCS.find(d=>d.ref===id&&d.type===ty).o;
  $("#lbi").innerHTML=`<div style="max-width:520px;padding:20px"><span class="mono">maanya.archive › ${esc(ty)}</span><h2 class="serif" style="font-size:34px;margin:8px 0 14px">${esc(n.title)}</h2><p class="serif" style="font-size:19px">${esc(n.body)}</p></div>`;
  noteMode=true;lastFocus=document.activeElement;$("#lb").classList.add("on","note");$("#close").focus();document.body.style.overflow="hidden"}
let noteMode=false,lastFocus=null;

/* lightbox */
function openLb(i){noteMode=false;lastFocus=document.activeElement;cur=i;paint();$("#lb").classList.remove("note");$("#lb").classList.add("on");$("#close").focus();document.body.style.overflow="hidden"}
function paint(){const p=list[cur];seen.add(p.id);
  $("#lbi").innerHTML=`<img src="${esc(p.src)}" alt="${esc(p.alt)}">`;
  $("#lbtitle").textContent=p.title;$("#lbmsg").textContent=p.message;$("#lbm").textContent=p.caption;
  $("#pos").textContent=String(cur+1).padStart(2,"0")+" / "+String(list.length).padStart(2,"0");
  $("#fav").classList.toggle("on",favs.has(p.id));$("#fav").textContent=favs.has(p.id)?"♥":"♡"}
function closeLb(){$("#lb").classList.remove("on");document.body.style.overflow="";lastFocus&&lastFocus.focus()}
const step=d=>{if(noteMode)return;cur=(cur+d+list.length)%list.length;paint()};
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);$("#close").onclick=closeLb;
$("#fav").onclick=()=>{const p=list[cur];favs.has(p.id)?favs.delete(p.id):favs.add(p.id);paint();toast(favs.has(p.id)?"saved to favourites":"removed")};
$("#rnd").onclick=()=>{if(noteMode)return;const un=list.map((p,i)=>i).filter(i=>!seen.has(list[i].id));const pool=un.length?un:list.map((p,i)=>i);cur=pool[Math.floor(Math.random()*pool.length)];paint()};
addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;
  if(e.key==="Escape")closeLb();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)});
let sx=null;$("#lb").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("#lb").addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1);sx=null});
function discover(){const un=PHOTOS.map((p,i)=>i).filter(i=>!seen.has(PHOTOS[i].id));list=PHOTOS;
  openLb((un.length?un:PHOTOS.map((p,i)=>i))[Math.floor(Math.random()*(un.length||PHOTOS.length))])}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1400)}
const PUCKER="M12 21C12 21 3 14.5 3 8.5C3 5.5 5.3 3.5 7.8 3.5C9.6 3.5 11.2 4.5 12 6C12.8 4.5 14.4 3.5 16.2 3.5C18.7 3.5 21 5.5 21 8.5C21 14.5 12 21 12 21Z";
const LIPS='<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="'+PUCKER+'"/></svg>';
function kissBurst(x,y){
  if(reduce){toast("sending love");return}
  const box=$("#kisses");
  for(let i=0;i<4;i++){const k=document.createElement("span");k.className="kiss";k.innerHTML=LIPS;
    k.style.left=(x+(Math.random()-.5)*40)+"px";k.style.top=(y+(Math.random()-.5)*20)+"px";
    k.style.setProperty("--dx",((Math.random()-.5)*120)+"px");k.style.setProperty("--r",((Math.random()-.5)*50)+"deg");
    k.style.animationDelay=(i*70)+"ms";k.style.scale=String(.7+Math.random()*.7);
    k.addEventListener("animationend",()=>k.remove());box.appendChild(k)}
}
$("#home").addEventListener("pointerdown",e=>{if(e.target.closest("input,button,.sug"))return;kissBurst(e.clientX,e.clientY)});
$("#home").addEventListener("keydown",e=>{if(e.key==="k"&&!e.target.closest("input")){const r=$(".logo").getBoundingClientRect();kissBurst(r.left+r.width/2,r.top+r.height/2)}});
/* floating-kisses particle background (homepage only) */
const bg=$("#bg"),bx=bg.getContext("2d"),LIP=new Path2D(PUCKER);
let P=[],raf=0,mx=-999,my=-999,bw=0,bh=0;
function sizeBg(){const d=Math.min(devicePixelRatio||1,2);bw=innerWidth;bh=innerHeight;bg.width=bw*d;bg.height=bh*d;bx.setTransform(d,0,0,d,0,0)}
function mk(init){return{x:Math.random()*bw,y:init?Math.random()*bh:bh+30,s:.6+Math.random()*1.1,vy:.25+Math.random()*.5,ph:Math.random()*6.28,sw:.4+Math.random()*.8,r:(Math.random()-.5)*.8,a:.35+Math.random()*.4,k:Math.random()<.3}}
function drawBg(){bx.clearRect(0,0,bw,bh);
  for(const p of P){bx.save();bx.translate(p.x,p.y);bx.rotate(p.r);bx.scale(p.s*1.3,p.s*1.3);bx.translate(-12,-12);bx.globalAlpha=p.a;const c=p.k?"#9d5cff":"#ff2bd6";bx.shadowColor=c;bx.shadowBlur=16;bx.fillStyle=c;bx.fill(LIP);bx.shadowBlur=0;bx.strokeStyle="#ffffff";bx.lineWidth=.7;bx.globalAlpha=p.a*.9;bx.stroke(LIP);bx.restore()}}
function stepBg(){
  for(const p of P){p.y-=p.vy;p.ph+=.012;p.x+=Math.sin(p.ph)*p.sw*.5;p.r+=Math.sin(p.ph*.7)*.002;
    const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<110&&d>0){p.x+=dx/d*(110-d)*.04;p.y+=dy/d*(110-d)*.04}
    if(p.y<-40){Object.assign(p,mk(false))}}
  drawBg();raf=requestAnimationFrame(stepBg)}
function startBg(){
  bg.style.display="block";sizeBg();
  if(!P.length)P=Array.from({length:innerWidth<600?16:30},()=>mk(true));
  cancelAnimationFrame(raf);
  if(reduce)drawBg();else raf=requestAnimationFrame(stepBg)}
function stopBg(){cancelAnimationFrame(raf);bg.style.display="none"}
addEventListener("resize",()=>{if(bg.style.display==="block"){sizeBg();if(reduce)drawBg()}});
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else if(bg.style.display==="block"&&!reduce){cancelAnimationFrame(raf);raf=requestAnimationFrame(stepBg)}});
render();
</script>
</body>
</html>
